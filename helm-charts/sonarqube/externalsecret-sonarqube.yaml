apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sonarqube-admin-password
  namespace: sonarqube
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: sonarqube-admin-password
  data:
    - secretKey: password
      remoteRef:
        key: secret/sonarqube/admin-password
        property: value
        namespace: vault-openbao
---
